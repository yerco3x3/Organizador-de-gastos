<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ede1cb;--card:#f8f2e6;--ink:#1f1b16;--acc:#6b5a45;--tint:#e3d4b8;--line:#d6c7aa;--mut:#574d41;--btn:#1f1b16;--btnink:#f8f2e6;--onacc:#fff;--red:#b8392b;--grn:#256b41;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--card:#282420;--ink:#f1e7d3;--acc:#d2bb94;--tint:#3a3328;--line:#443c30;--mut:#c4b9a6;--btn:#ede1cb;--btnink:#1f1b16;--onacc:#1d1a16;--grn:#5cc08a}.logo{filter:invert(1)}}
:root{color-scheme:light dark}
textarea{color:var(--ink)}
::placeholder{color:var(--mut);opacity:1}
option,optgroup{background:var(--card);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px Barlow,system-ui,sans-serif;padding:16px 16px 40px;max-width:980px;margin:auto}
.cond,h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0}
.mut{color:var(--mut)}
button,input{font:inherit;color:var(--ink)}
.bar{display:flex;align-items:flex-start;gap:8px;margin-bottom:22px}
.back{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:var(--card);font-size:22px;cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.st{flex:1;display:flex;list-style:none;margin:0;padding:0}
.st li{flex:1;position:relative;text-align:center;font-size:13px;color:var(--mut)}
.st li:not(:first-child)::before{content:'';position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.st li.done::before,.st li.cur::before{background:var(--acc)}
.dot{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;background:var(--line);color:var(--onacc);font-size:13px}
.st li.done .dot,.st li.cur .dot{background:var(--acc)}
.st li.cur{color:var(--ink);font-weight:600}
.grid{display:block}
@media(min-width:760px){.grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:32px;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
.who{display:flex;gap:12px;align-items:center}.logo{height:56px;width:auto}
.who b{display:block;font-size:24px;line-height:1.1}.who span{display:block;font-size:14px}.who .acc{color:var(--acc)}
dl{margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
dt{color:var(--mut)}dd{margin:0;font-weight:600}
h3{font-size:22px;margin:0 0 12px}
.wk{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.nav{flex:none;width:30px;height:44px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.nav:disabled{opacity:.25;cursor:default}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 0;text-align:center;cursor:pointer;opacity:.45}
.day small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}.day b{font:700 22px 'Barlow Condensed'}
.day.has{background:var(--tint);opacity:1;border-color:transparent}
.day.on{background:var(--acc);color:var(--onacc);opacity:1}.day.on small{color:var(--onacc)}
.day:disabled{cursor:default}
.tabs{display:inline-flex;border-radius:8px;overflow:hidden;margin:2px 0 14px}
.tabs button{border:0;background:var(--tint);padding:6px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--onacc)}
.tabs.cats{display:flex;flex-wrap:wrap;gap:6px;overflow:visible;border-radius:0}
.tabs.cats button{border-radius:8px;white-space:nowrap;padding:7px 12px}
.tabs button.promo{font-weight:600;color:var(--acc)}.tabs button.promo.on{color:var(--onacc)}
.duotot{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.4}.duotot b{font-size:15px}.duotot s{color:var(--mut)}
.pz{display:inline-block;font-size:11px;font-weight:600;background:var(--acc);color:var(--onacc);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.pnote{margin:10px 0 0;font-size:13.5px;color:var(--acc);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{border:0;border-radius:10px;background:var(--tint);padding:9px 6px;cursor:pointer;line-height:1.2}
.chip b{display:block;font-size:16px}.chip small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--acc);color:var(--onacc)}.chip.on small{color:var(--onacc)}
.cta{width:100%;margin-top:18px;border:0;border-radius:10px;padding:14px;background:var(--btn);color:var(--btnink);font-weight:600;cursor:pointer}
.cta:disabled{background:var(--tint);color:var(--mut);cursor:default}
.cta.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0}
.f{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.err{color:var(--red);min-height:20px;font-size:14px;margin-top:6px}
.ok{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--grn);border-radius:16px;padding:18px;max-width:560px;margin:0 auto}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);border-radius:10px;padding:12px;margin:10px 0}
a.cta{display:block;text-align:center;text-decoration:none}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.chip{min-height:48px}.cta{min-height:48px}.nav{width:34px;height:52px}
input,select{min-height:46px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts .cta{width:auto;margin:0;flex:1}
.acts .cta.alt{flex:0 0 34%}
.hl{background:var(--tint);padding:1px 7px;border-radius:7px;font-weight:700;white-space:nowrap}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:12px 14px;margin:14px 0}
.timer span{font-size:14px;line-height:1.3}
.timer b{font:700 32px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.off{border-left-color:var(--red);display:block}
.timer.off b{display:none}
.timer.off span{font-size:14px;font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 2px;font:inherit}

/* ===== Portada estilo agenda online ===== */
.bar[hidden]{display:none}
.hero{margin:-16px -16px 0}
.cover{height:128px;background:radial-gradient(circle at 16% 28%,rgba(255,255,255,.38),transparent 40%),radial-gradient(circle at 86% 78%,rgba(255,255,255,.22),transparent 38%),linear-gradient(135deg,#dcc8a6 0%,#b09270 58%,#836a52 100%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover{background:radial-gradient(circle at 16% 28%,rgba(255,255,255,.10),transparent 40%),linear-gradient(135deg,#4a3f31 0%,#3a3127 60%,#2a241d 100%)}}
.hb{padding:0 16px;text-align:center;margin-top:-54px}
.lgc{width:108px;height:108px;border-radius:50%;background:var(--card);border:4px solid var(--bg);display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.lgc img{height:80px;width:auto;mix-blend-mode:multiply}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgc img{mix-blend-mode:screen}}
@media(min-width:760px){.cover{height:170px;border-radius:0 0 22px 22px}.hb{margin-top:-60px}}
.hero h1{font-size:31px;line-height:1.05}
.hero .sub{margin:6px 0 0;color:var(--acc);font-size:15px;font-weight:500}
.hero .inf{margin:8px 0 0;font-size:14px;color:var(--mut);line-height:1.5}
.hero .inf a{color:inherit}
.hacts{display:flex;gap:8px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;text-decoration:none;color:var(--ink);min-height:42px}
.cat-wrap{max-width:760px;margin:0 auto}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin:22px 0 16px}
.ptabs button{flex:1;border:0;background:none;padding:12px 6px;font-weight:600;font-size:15.5px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;min-height:48px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.srch{position:relative;margin:0 0 12px}
.srch input{padding-left:42px;margin:0}
.srch span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.cchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.cchips::-webkit-scrollbar{display:none}
.cchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:42px}
.cchips button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.sec{margin:16px 0 4px}
.sec>h3{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:25px;margin:0 0 4px}
.sec>h3 small{font:500 13px Barlow,sans-serif;color:var(--mut)}
.grp{font:600 12.5px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:14px 2px 6px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;display:flex;flex-direction:column;gap:12px}
.svc h4{margin:0;font-size:16.5px;font-weight:600;line-height:1.3}
.sd{margin:4px 0 0;font-size:13.5px;color:var(--mut);line-height:1.4}
.meta{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--mut)}
.sp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr{font-size:17.5px;font-weight:600;white-space:nowrap}.pr small{font-size:12.5px;color:var(--mut);font-weight:500}.pr s{color:var(--mut);font-size:13px;font-weight:400;margin-left:6px}
.rbtn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font-weight:600;padding:10px 20px;min-height:44px;cursor:pointer;text-decoration:none;white-space:nowrap;font-size:14.5px}
.rbtn.wa{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.svc[hidden],.sec[hidden],.grp[hidden],#noRes[hidden],.pane[hidden]{display:none}
@media(min-width:760px){.svc{flex-direction:row;align-items:center;gap:16px}.svc .si{flex:1}.sp{flex:none;gap:16px}}
.info{line-height:1.5}.info h3{font-size:19px;margin:16px 0 4px}.info h3:first-child{margin-top:0}.info p{margin:0}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:30px 0 0}
.sumh{font-size:21px;margin:0}
.lnk{border:0;background:none;color:var(--acc);font-weight:600;padding:12px 0 0;cursor:pointer;font-size:14.5px;text-decoration:underline;min-height:44px}
.tgrp{font:600 13px Barlow,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px}
.ctabar{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%);margin-top:6px}
.ctabar .cta{margin-top:0}
.hint{margin:4px 0 0;font-size:13.5px;color:var(--mut)}

    busy=false;$('send').disabled=false;
    let msg='No se pudo enviar. Revisa tu conexión e intenta de nuevo.';
    if(x.code==='permission-denied'){
      try{const q=await db.collection('bloques').doc(tid+'_'+d+'_'+hhmm(s0)).get();
        if(q.exists)msg='Esa hora ya fue tomada por otra persona. Elige otra.';
        else{const pq=await db.collection('pendientes').doc(tel).get();msg=pq.exists?'Ya tienes una solicitud pendiente de pago con este teléfono. Cuando pagues el abono podrás reservar otra, o escríbenos por WhatsApp.':'No se pudo registrar la reserva (permiso denegado). Escríbenos por WhatsApp para reservar.'}}
      catch(y){msg='La reserva online aún no está activada en la base de datos. Escríbenos por WhatsApp para reservar.'}
    }
    er.textContent=msg+' ['+(x.code||'error')+']';
  }
});
