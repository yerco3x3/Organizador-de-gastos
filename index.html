<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10121A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuotas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Organiza las compras de tus tarjetas de crédito, divídelas entre personas y ve cuánto te debe cada una y en qué mes termina de pagar sus cuotas.">
<title>Cuotas Compartidas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'%3E%3Crect x='1' y='1' width='26' height='18' rx='3.5' fill='%232C41C2'/%3E%3Crect x='5' y='12' width='4' height='3' rx='1' fill='white'/%3E%3Crect x='11' y='12' width='4' height='3' rx='1' fill='white' opacity='.7'/%3E%3Crect x='17' y='12' width='4' height='3' rx='1' fill='white' opacity='.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: estado de cuenta — barra de secciones arriba, el mes como titular, resumen en un panel, una boleta por persona; cada compra se dibuja como su pista de cuotas. */
:root{
  --bg:#F1F2F6;
  --surface:#FFFFFF;
  --surface-2:#E8EAF1;
  --ink:#151929;
  --muted:#5C6176;
  --line:#D9DCE6;
  --accent:#2C41C2;
  --accent-ink:#FFFFFF;
  --accent-soft:#E1E5FB;
  --ok:#1B7A4C;
  --ok-soft:#DBF0E4;
  --warn:#975400;
  --warn-soft:#F9EAD2;
  --bad:#B01F33;
  --bad-soft:#F9DEE2;
  --overlay:rgb(14 17 30 / .45);
  --shadow:0 1px 2px rgb(21 25 41 / .05), 0 6px 20px rgb(21 25 41 / .06);
  --f-display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10121A; --surface:#191C27; --surface-2:#232736; --ink:#E8E9F1; --muted:#9A9FB4; --line:#2C3042;
    --accent:#8D9AFF; --accent-ink:#0D1030; --accent-soft:#252B56;
    --ok:#5ACF8E; --ok-soft:#14321F; --warn:#F0B257; --warn-soft:#382811; --bad:#FF7E8D; --bad-soft:#3C1720;
    --overlay:rgb(0 0 0 / .6); --shadow:0 1px 2px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#191C27; --surface-2:#232736; --ink:#E8E9F1; --muted:#9A9FB4; --line:#2C3042;
  --accent:#8D9AFF; --accent-ink:#0D1030; --accent-soft:#252B56;
  --ok:#5ACF8E; --ok-soft:#14321F; --warn:#F0B257; --warn-soft:#382811; --bad:#FF7E8D; --bad-soft:#3C1720;
  --overlay:rgb(0 0 0 / .6); --shadow:0 1px 2px rgb(0 0 0 / .35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.modal-open{overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
/* Márgenes laterales: crecen con la pantalla y respetan el notch del celular */
:root{--maxw:1320px;--gutter:clamp(16px,3.2vw,32px);--nav-h:0px}
.wrap,.top,.bottomnav{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.wrap{box-sizing:content-box;max-width:var(--maxw);margin:0 auto;padding-bottom:calc(64px + var(--nav-h))}

/* ---------- header ---------- */
/* ≥980px: una fila · 641–979px: dos filas · ≤640px: solo la marca arriba y navegación abajo */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs new";align-items:center;column-gap:20px;padding-block:10px 0}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;padding-bottom:10px;white-space:nowrap;min-width:0}
.brand svg{flex:none}
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-self:end;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.top .new{grid-area:new;margin-bottom:10px}
@media (max-width:979px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand new" "tabs tabs";padding-top:10px}
  .brand{padding-bottom:4px}
  .top .new{margin-bottom:4px}
  .tabs{margin-inline:-8px}
}
@media (max-width:640px){
  :root{--nav-h:64px}
  .top{position:static;background:var(--bg);border-bottom:0}
  .top-in{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand";padding-top:14px}
  .tabs,.top .new{display:none}
  .brand{font-size:17px;padding-bottom:0}
}
/* Celular de lado o pantallas bajas: el encabezado no se queda pegado arriba */
@media (max-height:500px){.top{position:static}}

/* ---------- navegación inferior (celulares) ---------- */
.bottomnav{display:none}
@media (max-width:640px){
  .bottomnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;height:var(--nav-h)}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;min-width:0;background:none;border:0;padding:6px 0 8px;color:var(--muted);font-size:clamp(9.5px,2.9vw,12px);letter-spacing:-.01em;font-weight:600;cursor:pointer;white-space:nowrap}
  .bottomnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bottomnav svg{width:22px;height:22px;flex:none}
  .bottomnav button[aria-current="page"]{color:var(--accent)}
  .bottomnav .nav-new{justify-content:flex-start;padding-top:0}
  .bottomnav .nav-new i{display:grid;place-items:center;width:48px;height:48px;margin-top:-14px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);border:3px solid var(--bg)}
  .bottomnav .nav-new i svg{width:22px;height:22px}
  .bottomnav .nav-new{color:var(--ink)}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;line-height:1;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:7px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.confirm{background:var(--bad);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.ok:hover{background:color-mix(in srgb,var(--ok) 22%,var(--ok-soft))}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- notice & month bar ---------- */
#notice{display:grid;gap:8px;margin-top:16px}
#notice:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice p{flex:1 1 260px;min-width:0}
.monthbar{display:flex;align-items:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.monthbar h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,6.6vw,46px);letter-spacing:-.025em;line-height:1;min-width:0;flex:1 1 auto}
.monthbar .eyebrow{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.monthbar .steps{display:flex;gap:6px;margin-left:auto;align-items:center}
@media (max-width:640px){.monthbar{margin-top:14px}}
#view{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
#view > *{min-width:0}
/* Mes en pantallas anchas: boletas a la izquierda, tarjetas a la derecha */
.mes-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:1180px){.mes-cols.has-aside{grid-template-columns:minmax(0,1fr) minmax(300px,360px)}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-head small{color:var(--muted);font-size:13px}

/* ---------- summary ---------- */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;container-type:inline-size}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px 18px;display:grid;gap:4px;align-content:start;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .label{font-size:13px;color:var(--muted);font-weight:500}
.stat .big{font-size:clamp(18px,2.6cqi,28px);font-weight:600;overflow-wrap:anywhere}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat.key{background:var(--accent-soft)}
.stat.key .big{color:var(--accent)}
@container (max-width:700px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat .big{font-size:clamp(18px,5.4cqi,26px)}
}
@container (max-width:360px){
  .stat{padding:13px 12px}
  .compo{padding-inline:12px}
}
.compo{padding:14px 18px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.compo-title{font-size:13px;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.bar span{display:block;height:100%;background:var(--c);min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.legend .num{color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
.dot.me{background:transparent;border:2px solid var(--muted)}

/* ---------- person slips ---------- */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;align-items:start}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.slip-head{display:flex;align-items:center;gap:10px}
.slip-head h3{font-size:17px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.slip-head .pill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.ex{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.slip-amt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.slip-amt .big{font-size:28px;font-weight:600;line-height:1}
.slip-amt small{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok);border-radius:3px}
.lines{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline;font-size:14px}
.lines .what{min-width:0;overflow-wrap:anywhere}
.lines .what small{display:block;color:var(--muted);font-size:12px}
.lines .k{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.lines .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lines li.paid-line{color:var(--ok)}
.lines li.paid-line .k{color:var(--ok)}
.slip-note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.slip-note.bad{background:var(--bad-soft)}
.slip-foot{font-size:13px;color:var(--muted)}
.pays{display:grid;gap:4px;font-size:13px}
.pays li{display:flex;align-items:center;gap:8px;color:var(--ok)}
.pays li span{flex:1;min-width:0}
.pays button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- card totals ---------- */
.cards-sec{container-type:inline-size}
.cardrows{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cardrows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.cardrows li:first-child{border-top:0}
.cardrows strong{display:block}
.cardrows small{color:var(--muted);font-size:12.5px}
.cardrows .amt{text-align:right}
.cardrows .amt .num{font-size:16px;font-weight:600;display:block}
/* Cuando la lista es angosta (celular o columna lateral), el monto baja bajo el nombre */
@container (max-width:520px){
  .cardrows li{grid-template-columns:auto minmax(0,1fr);align-items:start}
  .cardrows li > .cardchip{margin-top:3px}
  .cardrows .amt{grid-column:2;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
  .cardrows .amt .num{display:inline}
}
.cardchip{width:26px;height:18px;border-radius:4px;background:var(--c,var(--muted));position:relative;flex:none;display:inline-block}
.cardchip::after{content:"";position:absolute;left:4px;top:5px;width:7px;height:5px;border-radius:1.5px;background:rgb(255 255 255 / .75)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag .cardchip{width:16px;height:11px;border-radius:2.5px}
.tag .cardchip::after{left:2px;top:3px;width:4px;height:3px}

/* ---------- empty / onboarding ---------- */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;display:grid;gap:12px;justify-items:start}
.empty h3{font-size:17px}
.empty p{color:var(--muted);max-width:60ch}
.onboard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,26px);display:grid;gap:16px;max-width:760px}
.onboard h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.015em}
.onboard ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.onboard li{counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;align-items:start}
.onboard li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-num);font-weight:600;font-size:13px}
.onboard li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.onboard li p{color:var(--muted);font-size:14px}
.loading{padding:40px 0;color:var(--muted);display:flex;align-items:center;gap:10px}
.loading i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- purchases ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg .count{font-family:var(--f-num);font-size:11px;margin-left:4px;opacity:.75}
select.sel{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;max-width:100%;min-width:0}
@media (max-width:640px){
  .filters .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .filters .seg button{white-space:normal;text-align:center;line-height:1.2}
  .filters select.sel{flex:1 1 140px}
}
/* En pantallas anchas las compras se ordenan en dos columnas */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:12px;align-items:start}
.purchase{background:var(--surface);border:1px solid var(--line);border-radius:12px;container-type:inline-size;min-width:0}
.p-in{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.p-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.p-title h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.p-amt{text-align:right}
.p-amt .num{font-size:17px;font-weight:600;display:block}
.p-amt small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.p-track{grid-column:1/-1;display:grid;gap:6px}
.pips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pip{width:14px;height:8px;border-radius:2px;border:1.5px solid var(--line);background:transparent}
.pip.done{background:var(--muted);border-color:var(--muted);opacity:.45}
.pip.now{background:var(--accent);border-color:var(--accent);width:22px}
.pips .more{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-left:2px}
.track-label{font-size:13px}
.track-label b{font-weight:600}
.p-who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}

/* ---------- projection ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}

.proj th,.proj td{padding:10px 12px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}

.proj .pname{display:flex;align-items:center;gap:8px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}

/* ---------- settings ---------- */

.panel-head p{color:var(--muted);font-size:13.5px;margin-top:4px}

.set-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set-list li:first-child{border-top:0}
.set-list small{color:var(--muted);font-size:12.5px;white-space:nowrap}
input.inline{flex:1 1 140px;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:16px}
input.inline:hover{border-color:var(--line)}
input.inline:focus{border-color:var(--accent);background:var(--bg);outline:none}
.cierre{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.empty-line{color:var(--muted);font-size:14px;padding:6px 0}

/* ---------- modal ---------- */

.sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:640px;max-height:calc(100% - 8px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgb(0 0 0 / .25);animation:rise .18s ease-out}

@media (max-width:560px){

.form{display:grid;gap:14px}

/* ---------- cuenta e inicio de sesión ---------- */
body[data-auth="out"],body[data-auth="loading"]{--nav-h:0px}
body[data-auth="out"] .tabs,body[data-auth="out"] .top .new,body[data-auth="out"] .bottomnav,

.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(18px,5vw,28px);display:grid;gap:16px}

.btn.wide{width:100%;min-height:46px;font-size:15px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-info{color:var(--ok);font-size:14px;font-weight:600}
.auth-info:empty{display:none}
.auth-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px}
.auth .form{gap:12px}
.auth button:disabled{opacity:.6;cursor:progress}
code{font-family:var(--f-num);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.panel-head p + p{margin-top:8px}
.sync{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:3px 9px;border-radius:999px;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:0;background:var(--surface-2);color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.sync.warn{background:var(--warn-soft);color:var(--warn)}

.sync.busy i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}
@media (max-width:640px){.brand .sync{margin-left:auto}}
@media (max-width:400px){.brand .sync span{display:none}.brand .sync{padding:6px}}
.sync-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.sync-line .sync{margin:0;padding:4px}
.sync-line .sync span{display:none}

/* ---------- como app instalada ---------- */
.tabs,.bottomnav,.btn,.chip,.icon-btn,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (display-mode:standalone){body{overscroll-behavior-y:none}}
.install-steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted);font-size:13.5px}

/* ---------- pantallas táctiles: botones más fáciles de tocar ---------- */
@media (pointer:coarse){
  .btn{min-height:44px}
  .btn.small{min-height:40px;padding-inline:12px}

  input.inline{min-height:40px}
  .add-row input{min-height:44px}

}

/* ---------- pantallas muy grandes ---------- */
@media (min-width:1800px){
  :root{--maxw:1440px}
  body{font-size:16px}
}

<script src="firebase-config.js"></script>
<script>
(() => {
'use strict';

/* ================= helpers ================= */
const ME = 'me';
const LKEY = 'cuotas-compartidas-v1';
const UIKEY = 'cuotas-compartidas-ui';
const VIEWS = ['mes','compras','proyeccion','ajustes'];
const PCOLORS = ['#E8590C','#2F9E44','#7048E8','#D6336C','#1C7ED6','#0C8599','#F08C00','#66A80F','#AE3EC9','#C92A2A'];
const CCOLORS = ['#2C41C2','#0B7285','#9C36B5','#C92A2A','#2B8A3E','#E67700','#495057'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const nf = new Intl.NumberFormat('es-CL', {maximumFractionDigits: 0});
const money = n => '$' + nf.format(Math.round(num(n)));
const parseMoney = s => { const d = String(s || '').replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : 0; };
const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? c : '#868E96';
const pad = n => String(n).padStart(2, '0');
const mk = (y, m) => y + '-' + pad(m);
const mParse = k => { const a = String(k).split('-'); return {y: +a[0], m: +a[1]}; };
const mIdx = k => { const o = mParse(k); return o.y * 12 + (o.m - 1); };
const mFromIdx = t => mk(Math.floor(t / 12), (t % 12) + 1);
const mAdd = (k, d) => mFromIdx(mIdx(k) + d);
const mDiff = (a, b) => mIdx(a) - mIdx(b);
const mLabel = k => { const o = mParse(k); return MONTHS[o.m - 1] + ' ' + o.y; };
const mShort = k => { const o = mParse(k); return MONTHS[o.m - 1].slice(0, 3) + ' ' + String(o.y).slice(2); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const todayKey = () => { const d = new Date(); return mk(d.getFullYear(), d.getMonth() + 1); };
const fmtDate = iso => { const a = String(iso || '').split('-').map(Number); if (a.length < 3 || !a[1]) return ''; return pad(a[2]) + ' ' + MONTHS[a[1] - 1].slice(0, 3) + ' ' + a[0]; };
const newId = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, a, b) => n === 1 ? a : b;

/* ================= state & storage ================= */
const S = {people: {}, cards: {}, purchases: {}, payments: {}};
const COLS = Object.keys(S);
// backend: 'loading' | 'local' (solo este navegador) | 'cloud' (Firebase, con sesión) | 'signedout' | 'error'
let backend = 'loading';
const readOnly = false;
let storageOk = true;

/* ---------- Firebase ---------- */
const SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
const FB = {A: null, F: null, app: null, auth: null, db: null, user: null, unsubs: [], ready: new Set(), server: new Set(), pending: new Set(), timer: null, cfg: null, loadErr: null};
const authUI = {mode: 'login', email: ''};
let cloudErr = '';
let online = navigator.onLine !== false;
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const INSTALL_KEY = 'cuotas-instalar-oculto';
const cloud = () => backend === 'cloud' && !!(FB.db && FB.user);
function fbConfig() {
  const c = window.FIREBASE_CONFIG;
  if (!c || typeof c !== 'object') return null;
  const ok = ['apiKey', 'authDomain', 'projectId', 'appId'].every(k => typeof c[k] === 'string' && c[k].trim() && !/PEGA_AQUI/i.test(c[k]));
  return ok ? c : null;
}
const userRef = (col, id) => FB.F.doc(FB.db, 'users', FB.user.uid, col, id);

async function initFirebase(cfg) {
  FB.cfg = cfg;
  try {
    const [appM, authM, fsM] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
    FB.A = authM; FB.F = fsM;
    FB.app = appM.initializeApp(cfg);
    try { FB.db = fsM.initializeFirestore(FB.app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
    catch (e) { FB.db = fsM.getFirestore(FB.app); }
    FB.auth = authM.getAuth(FB.app);
    try { authM.useDeviceLanguage(FB.auth); } catch (e) {}
    authM.onAuthStateChanged(FB.auth, user => {
      unsubscribeAll();
      COLS.forEach(c => { S[c] = {}; });
      cloudErr = '';
      FB.user = user || null;
      backend = user ? 'cloud' : 'signedout';
      document.body.dataset.auth = user ? 'in' : 'out';
      if (user) subscribe(user.uid);

function cloudErrorText(e) {

/* Guarda en Firebase la diferencia entre dos estados completos (respaldo, deshacer, subir datos locales) */
function cloudSync(prev, next) {
  const F = FB.F; const ops = [];
  COLS.forEach(c => {
    const a = prev[c] || {}, b = next[c] || {};
    Object.keys(a).forEach(id => { if (!b[id]) ops.push({del: true, c, id}); });
    Object.keys(b).forEach(id => { const body = JSON.parse(JSON.stringify(b[id])); delete body.id; ops.push({c, id, body}); });
  });
  const jobs = [];
  for (let i = 0; i < ops.length; i += 450) {
    const batch = F.writeBatch(FB.db);
    ops.slice(i, i + 450).forEach(o => { if (o.del) batch.delete(userRef(o.c, o.id)); else batch.set(userRef(o.c, o.id), o.body); });
    jobs.push(batch.commit());
  }

}

/* ================= data model ================= */
function people() { return Object.values(S.people).filter(p => p && p.name).sort((a, b) => String(a.name).localeCompare(String(b.name), 'es')); }
function cardsList() { return Object.values(S.cards).filter(c => c && c.name).sort((a, b) => String(a.name).localeCompare(String(b.name), 'es')); }
function purchases() {
  return Object.values(S.purchases)
    .filter(p => p && typeof p.first === 'string' && /^\d{4}-\d{2}$/.test(p.first) && num(p.n) >= 1 && p.split && typeof p.split === 'object')
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(a.desc || '').localeCompare(String(b.desc || ''), 'es'));
}
function payments() { return Object.values(S.payments).filter(x => x && x.personId && typeof x.month === 'string'); }
const personName = id => id === ME ? 'Yo' : (S.people[id] ? S.people[id].name : 'Persona eliminada');
const personColor = id => id === ME ? null : safeColor(S.people[id] && S.people[id].color);
const dotHTML = id => id === ME ? '<span class="dot me" aria-hidden="true"></span>' : `<span class="dot" style="--c:${personColor(id)}" aria-hidden="true"></span>`;
const cardName = id => S.cards[id] ? S.cards[id].name : 'Tarjeta eliminada';
const cardTag = id => `<span class="tag"><span class="cardchip" style="--c:${safeColor(S.cards[id] && S.cards[id].color)}" aria-hidden="true"></span>${esc(cardName(id))}</span>`;
const pn = p => Math.max(1, Math.round(num(p.n)));
const lastMonth = p => mAdd(p.first, pn(p) - 1);
const cuotaIndex = (p, month) => { const k = mDiff(month, p.first) + 1; return (k >= 1 && k <= pn(p)) ? k : 0; };

function owedIn(p, pid, month) {
  const n = pn(p);
  const k = mDiff(month, p.first) + 1;
  if (k < 1 || k > n) return 0;
  const share = Math.round(num(p.split[pid]));
  if (share <= 0) return 0;
  const base = Math.floor(share / n);
  return k === 1 ? share - base * (n - 1) : base;
}
function purchaseMonthTotal(p, month) { return Object.keys(p.split).reduce((s, pid) => s + owedIn(p, pid, month), 0); }

function personMonth(pid, month) {
  const items = []; let owed = 0;
  purchases().forEach(p => { const a = owedIn(p, pid, month); if (a > 0) { items.push({p, k: cuotaIndex(p, month), a}); owed += a; } });
  const pays = pid === ME ? [] : payments().filter(x => x.personId === pid && x.month === month).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const paid = pays.reduce((s, x) => s + Math.round(num(x.amount)), 0);
  return {items, owed, paid, pays, left: Math.max(0, owed - paid), extra: Math.max(0, paid - owed)};
}
function firstMonthOf(pid) {
  let start = null;
  purchases().forEach(p => { if (num(p.split[pid]) > 0 && (!start || mDiff(p.first, start) < 0)) start = p.first; });
  payments().forEach(x => { if (x.personId === pid && /^\d{4}-\d{2}$/.test(x.month) && (!start || mDiff(x.month, start) < 0)) start = x.month; });
  return start;
}
function arrearsOf(pid, month) {
  const start = firstMonthOf(pid); const months = []; let total = 0;
  if (!start) return {total, months};
  for (let k = start; mDiff(month, k) > 0; k = mAdd(k, 1)) {
    const pm = personMonth(pid, k); const l = pm.owed - pm.paid;
    if (l > 0) { total += l; months.push({month: k, left: l}); }
  }
  return {total, months};
}
function outlook(pid, month) {
  let end = null;
  purchases().forEach(p => { if (num(p.split[pid]) > 0) { const l = lastMonth(p); if (!end || mDiff(l, end) > 0) end = l; } });
  if (!end || mDiff(end, month) < 0) return {end, remaining: 0, months: 0};
  let remaining = 0, months = 0;
  for (let k = month; mDiff(end, k) >= 0; k = mAdd(k, 1)) {
    const pm = personMonth(pid, k);
    if (pm.owed > 0) months++;
    remaining += Math.max(0, pm.owed - pm.paid);
  }
  return {end, remaining, months};
}
function suggestFirst(cardId, dateISO) {
  const a = String(dateISO || todayISO()).split('-').map(Number);
  const c = S.cards[cardId];
  const cierre = c ? Math.round(num(c.cierre)) : 0;
  const add = (cierre >= 1 && a[2] > cierre) ? 2 : 1;
  return mAdd(mk(a[0], a[1]), add);
}
function nextColor(list, col) {
  const used = Object.values(S[col]).map(x => x && x.color);
  return list.find(c => !used.includes(c)) || list[Object.keys(S[col]).length % list.length];

function renderSync() {
  const el = $('#sync'); if (!el) return;
  if (!cloud()) { el.hidden = true; return; }
  let cls = 'ok', txt = 'Sincronizado';
  if (!online) { cls = 'warn'; txt = 'Sin conexión'; }
  else if (cloudErr) { cls = 'bad'; txt = 'Error al guardar'; }
  else if (FB.pending.size || FB.server.size < COLS.length) { cls = 'busy'; txt = 'Guardando…'; }
  el.hidden = false;
  el.className = 'sync ' + cls;
  el.title = txt;
  el.setAttribute('aria-label', 'Estado de Firebase: ' + txt);
  el.innerHTML = `<i aria-hidden="true"></i><span>${txt}</span>`;
}

function renderNotice() {
  const out = [];
  if (backend === 'local' && !storageOk) out.push(`<div class="notice warn"><p>Este navegador no está guardando datos (puede ser una ventana privada o incógnito). Lo que agregues se perderá al cerrar la pestaña.</p></div>`);
  if (cloud() && !online) out.push(`<div class="notice warn"><p><strong>Sin conexión.</strong> Puedes seguir usando la página; los cambios se subirán a Firebase cuando vuelva internet.</p></div>`);
  if (cloud() && cloudErr) out.push(`<div class="notice warn"><p>${esc(cloudErr)}</p><button type="button" class="btn small" data-act="cloud-retry">Reintentar</button></div>`);
  const mig = backend === 'cloud' ? migrationOffer() : null;
  if (mig) {
    const parts = [];
    if (mig.n.purchases) parts.push(mig.n.purchases + ' ' + plural(mig.n.purchases, 'compra', 'compras'));
    if (mig.n.people) parts.push(mig.n.people + ' ' + plural(mig.n.people, 'persona', 'personas'));
    if (mig.n.cards) parts.push(mig.n.cards + ' ' + plural(mig.n.cards, 'tarjeta', 'tarjetas'));
    out.push(`<div class="notice"><p>Este navegador tiene <strong>${esc(parts.join(', '))}</strong> que guardaste antes de conectar Firebase. ¿Las subimos a tu cuenta?</p>
      <div class="actions"><button type="button" class="btn small primary" data-act="migrate-yes">Subir a mi cuenta</button><button type="button" class="btn small ghost" data-act="migrate-no">No, gracias</button></div></div>`);
  }
  let hideInstall = false; try { hideInstall = !!localStorage.getItem(INSTALL_KEY); } catch (e) {}
  if (installEvt && !isStandalone() && !hideInstall && (backend === 'local' || backend === 'cloud') && !mig) {
    out.push(`<div class="notice"><p><strong>Instala Cuotas en tu celular</strong> para abrirla desde su ícono, a pantalla completa y sin internet.</p>
      <div class="actions"><button type="button" class="btn small primary" data-act="install">Instalar app</button><button type="button" class="btn small ghost" data-act="install-later">Ahora no</button></div></div>`);
  }
  if ((backend === 'local' || backend === 'cloud') && hasExamples()) {
    out.push(`<div class="notice"><p><strong>Estos son datos de ejemplo</strong> para que veas cómo funciona. Cuando quieras, bórralos y agrega tus propias compras.</p>
      <button type="button" class="btn small ${ui.confirmClear ? 'confirm' : ''}" data-act="clear-examples">${ui.confirmClear ? 'Sí, borrar ejemplos' : 'Borrar datos de ejemplo'}</button></div>`);
  }
  $('#notice').innerHTML = out.join('');
}

/* ---------- Mes ---------- */
function viewMes() {
  const m = ui.month;
  const ps = people();
  if (!purchases().length) return onboarding();

  const rows = ps.map(p => ({p, pm: personMonth(p.id, m), ar: arrearsOf(p.id, m)}))
    .filter(r => r.pm.owed > 0 || r.pm.paid > 0 || r.ar.total > 0)
    .sort((a, b) => (b.pm.left + b.ar.total) - (a.pm.left + a.ar.total) || String(a.p.name).localeCompare(String(b.p.name), 'es'));
  const me = personMonth(ME, m);
  const owedOthers = rows.reduce((s, r) => s + r.pm.owed, 0);
  const paidOthers = rows.reduce((s, r) => s + Math.min(r.pm.paid, r.pm.owed), 0);
  const leftOthers = rows.reduce((s, r) => s + r.pm.left, 0);
  const arrearsAll = rows.reduce((s, r) => s + r.ar.total, 0);
  const cardTotal = owedOthers + me.owed;

  if (!cardTotal && !arrearsAll && !rows.some(r => r.pm.paid)) {
    return `<section class="empty"><h3>No hay cuotas que se cobren en ${esc(mLabel(m))}</h3>
      <p>Ninguna compra registrada tiene una cuota este mes. Revisa otro mes con las flechas o agrega una compra nueva.</p>
      <button type="button" class="btn primary" data-act="new">+ Nueva compra</button></section>`;
  }

  const segs = rows.filter(r => r.pm.owed > 0).map(r => ({id: r.p.id, name: r.p.name, a: r.pm.owed, c: safeColor(r.p.color)}));
  if (me.owed > 0) segs.push({id: ME, name: 'Yo', a: me.owed, c: 'var(--muted)'});

  const summary = `
  <section class="summary" aria-label="Resumen del mes">
    <div class="stats">
      <div class="stat"><span class="label">Cobro total de tus tarjetas</span><span class="big num">${money(cardTotal)}</span><span class="sub">en cuotas de este mes</span></div>
      <div class="stat key"><span class="label">Te deben este mes</span><span class="big num">${money(owedOthers)}</span><span class="sub">${leftOthers > 0 ? 'faltan ' + money(leftOthers) + ' por cobrar' : (owedOthers > 0 ? 'todo cobrado' : 'nadie te debe este mes')}</span></div>
      <div class="stat"><span class="label">Ya te pagaron</span><span class="big num">${money(paidOthers)}</span><span class="sub">${arrearsAll > 0 ? '+ ' + money(arrearsAll) + ' atrasado de otros meses' : (owedOthers ? Math.round(paidOthers / owedOthers * 100) + '% de lo del mes' : '—')}</span></div>
      <div class="stat"><span class="label">Tu parte</span><span class="big num">${money(me.owed)}</span><span class="sub">lo que pagas tú</span></div>
    </div>
    ${cardTotal > 0 ? `<div class="compo">
      <span class="compo-title">Quién paga el cobro de ${esc(MONTHS[mParse(m).m - 1])}</span>
      <div class="bar" role="img" aria-label="${esc(segs.map(s => s.name + ' ' + money(s.a)).join(', '))}">${segs.map(s => `<span style="--c:${s.c};width:${(s.a / cardTotal * 100).toFixed(2)}%"></span>`).join('')}</div>
      <ul class="legend">${segs.map(s => `<li>${dotHTML(s.id)}<span>${esc(s.name)}</span><span class="num">${money(s.a)} · ${Math.round(s.a / cardTotal * 100)}%</span></li>`).join('')}</ul>
    </div>` : ''}
  </section>`;

  const slips = rows.length ? `<section>
    <div class="sec-head"><h2>Quién te debe en ${esc(MONTHS[mParse(m).m - 1])}</h2><small>${rows.length} ${plural(rows.length, 'persona', 'personas')}</small></div>
    <div class="slips">${rows.map(r => slipHTML(r.p, r.pm, r.ar, m)).join('')}</div>
  </section>` : `<section class="empty"><h3>Nadie te debe en ${esc(mLabel(m))}</h3><p>Todas las cuotas de este mes son tuyas.</p></section>`;

  const byCard = cardsList().map(c => {
    let total = 0, mine = 0, count = 0;
    purchases().forEach(p => { if (p.cardId !== c.id) return; const t = purchaseMonthTotal(p, m); if (t > 0) { count++; total += t; mine += owedIn(p, ME, m); } });
    return {c, total, mine, count};
  }).filter(x => x.total > 0);
  const cardsSec = byCard.length ? `<section class="cards-sec">
    <div class="sec-head"><h2>Por tarjeta</h2><small>para comparar con tu estado de cuenta</small></div>
    <ul class="cardrows">${byCard.map(x => `<li>
      <span class="cardchip" style="--c:${safeColor(x.c.color)}" aria-hidden="true"></span>
      <div><strong>${esc(x.c.name)}</strong><small>${x.count} ${plural(x.count, 'compra', 'compras')} con cuota este mes${x.c.cierre ? ' · cierre día ' + Math.round(num(x.c.cierre)) : ''}</small></div>
      <div class="amt"><span class="num">${money(x.total)}</span><small>tu parte ${money(x.mine)} · otros ${money(x.total - x.mine)}</small></div>
    </li>`).join('')}</ul>
  </section>` : '';

  return summary + `<div class="mes-cols ${cardsSec ? 'has-aside' : ''}">${slips}${cardsSec}</div>`;
}

/* Marca las tablas que no caben en la pantalla para mostrar la pista de "desliza" */
function markScrollers() {
  document.querySelectorAll('.proj-sec').forEach(sec => {
    const w = sec.querySelector('.tbl-wrap');
    if (w) sec.classList.toggle('scrolls', w.scrollWidth > w.clientWidth + 1);
  });
}
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(markScrollers, 120); });

function slipHTML(p, pm, ar, m) {
  const o = outlook(p.id, m);
  let pill;
  if (pm.owed === 0 && ar.total > 0) pill = '<span class="pill bad">Atrasado</span>';
  else if (pm.owed > 0 && pm.left === 0) pill = '<span class="pill ok">Pagado</span>';
  else if (pm.paid > 0) pill = '<span class="pill warn">Pago parcial</span>';
  else pill = '<span class="pill">Pendiente</span>';
  const pct = pm.owed ? Math.min(100, pm.paid / pm.owed * 100) : 0;
  const lines = pm.items.map(it => `<li>
      <span class="what">${esc(it.p.desc)}<small>${esc(cardName(it.p.cardId))}</small></span>
      <span class="k">${pn(it.p) > 1 ? it.k + '/' + pn(it.p) : 'único'}</span>
      <span class="amt">${money(it.a)}</span></li>`).join('');
  const pays = pm.pays.map(x => `<li><span>✓ Pagó ${money(x.amount)}${x.date ? ' el ' + esc(fmtDate(x.date)) : ''}${x.note ? ' · ' + esc(x.note) : ''}</span><button type="button" data-act="del-pay" data-id="${esc(x.id)}">Deshacer</button></li>`).join('');
  const arrears = ar.total > 0 ? `<p class="slip-note bad">Arrastra <strong class="num">${money(ar.total)}</strong> sin pagar de ${ar.months.map(x => `<button type="button" class="linkish" data-act="goto-month" data-month="${x.month}">${esc(mLabel(x.month))}</button>`).join(', ')}.</p>` : '';
  const extra = pm.extra > 0 ? `<p class="slip-note">Pagó ${money(pm.extra)} de más este mes.</p>` : '';
  let foot = '';
  if (o.end) {
    if (mDiff(o.end, m) <= 0 && pm.owed > 0) foot = 'Esta es su última cuota.';
    else if (mDiff(o.end, m) > 0) foot = `Termina de pagar en ${mLabel(o.end)} · le ${plural(o.months, 'queda', 'quedan')} ${o.months} ${plural(o.months, 'mes', 'meses')} y ${money(o.remaining)} por pagar desde este mes.`;
  }
  return `<article class="slip">
    <div class="slip-head">${dotHTML(p.id)}<h3>${esc(p.name)}</h3>${p.example ? '<span class="ex">ejemplo</span>' : ''}${pill}</div>
    <div class="slip-amt"><span class="big num">${money(pm.left)}</span><small>${pm.paid > 0 ? 'le falta de ' + money(pm.owed) + ' este mes' : 'por pagar este mes'}</small></div>
    ${pm.owed > 0 ? `<div class="meter" role="img" aria-label="Pagado ${Math.round(pct)}%"><span style="width:${pct.toFixed(1)}%"></span></div>` : ''}
    ${lines ? `<ul class="lines">${lines}</ul>` : ''}
    ${pays ? `<ul class="pays">${pays}</ul>` : ''}
    ${arrears}${extra}
    ${foot ? `<p class="slip-foot">${esc(foot)}</p>` : ''}
    <div class="actions">
      ${pm.left > 0 ? `<button type="button" class="btn small ok" data-act="paid-full" data-id="${esc(p.id)}">Marcar pagado</button>` : ''}
      <button type="button" class="btn small" data-act="pay" data-id="${esc(p.id)}">${pm.left > 0 ? 'Pago parcial' : 'Registrar pago'}</button>
      <button type="button" class="btn small ghost" data-act="copy" data-id="${esc(p.id)}">${canShare() ? 'Enviar mensaje' : 'Copiar mensaje'}</button>
    </div>
  </article>`;
}

/* ---------- Compras ---------- */
function statusOf(p, m) { const k = mDiff(m, p.first) + 1; return k < 1 ? 'futuras' : k > pn(p) ? 'terminadas' : 'activas'; }
function viewCompras() {
  const m = ui.month;
  const all = purchases();
  if (!all.length) return onboarding();
  let base = all;
  if (ui.fCard) base = base.filter(p => p.cardId === ui.fCard);
  if (ui.fPerson) base = base.filter(p => num(p.split[ui.fPerson]) > 0);
  const counts = {activas: 0, futuras: 0, terminadas: 0, todas: base.length};
  base.forEach(p => counts[statusOf(p, m)]++);
  const list = ui.filter === 'todas' ? base : base.filter(p => statusOf(p, m) === ui.filter);
  const mon = MONTHS[mParse(m).m - 1];
  const segBtn = (v, label) => `<button type="button" data-act="filter" data-v="${v}" aria-pressed="${ui.filter === v}">${label}<span class="count">${counts[v]}</span></button>`;
  const filters = `<div class="filters">
    <div class="seg" role="group" aria-label="Estado">${segBtn('activas', 'Con cuota en ' + mon)}${segBtn('futuras', 'Por empezar')}${segBtn('terminadas', 'Terminadas')}${segBtn('todas', 'Todas')}</div>
    <select class="sel" id="flt-card" aria-label="Filtrar por tarjeta"><option value="">Todas las tarjetas</option>${cardsList().map(c => `<option value="${esc(c.id)}" ${ui.fCard === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <select class="sel" id="flt-person" aria-label="Filtrar por persona"><option value="">Todas las personas</option><option value="${ME}" ${ui.fPerson === ME ? 'selected' : ''}>Yo</option>${people().map(p => `<option value="${esc(p.id)}" ${ui.fPerson === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
  </div>`;
  const items = list.length ? `<div class="plist">${list.map(p => purchaseHTML(p, m)).join('')}</div>`
    : `<div class="empty"><h3>No hay compras en esta lista</h3><p>Prueba con otro filtro o cambia de mes con las flechas.</p></div>`;
  return `<section>${filters}</section><section>${items}</section>`;
}
function purchaseHTML(p, m) {
  const n = pn(p), k = mDiff(m, p.first) + 1, last = lastMonth(p);
  const show = Math.min(n, 36);
  let pips = '';
  for (let i = 1; i <= show; i++) pips += `<i class="pip ${i < k ? 'done' : i === k ? 'now' : ''}"></i>`;
  if (n > 36) pips += `<span class="more">+${n - 36}</span>`;
  let label;
  if (k < 1) label = `Primera cuota en <b>${esc(mLabel(p.first))}</b>${n > 1 ? ' · termina en ' + esc(mLabel(last)) : ''}`;
  else if (k > n) label = `Terminó de pagarse en ${esc(mLabel(last))}`;
  else if (n === 1) label = `Pago único en <b>${esc(mLabel(m))}</b>`;
  else label = `Cuota <b>${k} de ${n}</b> en ${esc(MONTHS[mParse(m).m - 1])} · ${k === n ? 'última cuota' : 'termina en ' + esc(mLabel(last))}`;
  const who = Object.keys(p.split).filter(id => num(p.split[id]) > 0).map(id => `<span class="who-chip">${dotHTML(id)}${esc(personName(id))} <span class="num">${money(p.split[id])}${n > 1 ? ' · ' + money(Math.floor(num(p.split[id]) / n)) + '/mes' : ''}</span></span>`).join('');
  return `<article class="purchase"><div class="p-in">
    <div class="p-title"><h3>${esc(p.desc)}</h3>${p.example ? '<span class="ex">ejemplo</span>' : ''}</div>
    <div class="p-amt"><span class="num">${money(p.total)}</span><small>${n > 1 ? n + ' cuotas de ' + money(Math.round(num(p.total) / n)) : 'pago único'}</small></div>
    <div class="p-meta">${cardTag(p.cardId)}<span>Comprado el ${esc(fmtDate(p.date))}</span></div>
    <div class="p-track"><div class="pips" aria-hidden="true">${pips}</div><span class="track-label">${label}</span></div>
    <div class="p-who">${who}</div>
    <div class="p-actions"><button type="button" class="btn small ghost" data-act="edit" data-id="${esc(p.id)}">Editar</button></div>
  </div></article>`;
}

/* ---------- Proyección ---------- */
function viewProyeccion() {
  const start = ui.month;
  if (!purchases().length) return onboarding();
  const months = Array.from({length: 12}, (_, i) => mAdd(start, i));
  const rows = people().map(p => {
    const vals = months.map(k => { const pm = personMonth(p.id, k); return Math.max(0, pm.owed - pm.paid); });
    return {id: p.id, name: p.name, vals, o: outlook(p.id, start), ar: arrearsOf(p.id, start)};
  }).filter(r => r.vals.some(v => v > 0) || r.o.remaining > 0);
  const meVals = months.map(k => personMonth(ME, k).owed);
  const meO = outlook(ME, start);
  const totals = months.map(k => purchases().reduce((s, p) => s + purchaseMonthTotal(p, k), 0));
  const max = Math.max(1, ...rows.flatMap(r => r.vals), ...meVals);
  const shade = v => v > 0 ? `background:color-mix(in srgb,var(--accent) ${(6 + 30 * v / max).toFixed(1)}%,transparent)` : '';
  const cells = (vals, end) => vals.map((v, i) => `<td class="cell ${v ? '' : 'zero'} ${end && months[i] === end ? 'last' : ''}" style="${shade(v)}">${v ? money(v) : '—'}</td>`).join('');
  const totalOwed = rows.reduce((s, r) => s + r.o.remaining, 0);
  const lastOne = rows.reduce((a, r) => (!a || (r.o.end && mDiff(r.o.end, a.o.end) > 0)) ? r : a, null);
  const peakI = totals.indexOf(Math.max(...totals));

  const facts = `<section class="facts">
    <div class="fact"><span class="label">Te deben desde ${esc(mLabel(start))}</span><span class="big num">${money(totalOwed)}</span><small>sumando todas las cuotas que faltan</small></div>
    <div class="fact"><span class="label">Mes con más cobro</span><span class="big num">${totals[peakI] ? money(totals[peakI]) : '—'}</span><small>${totals[peakI] ? esc(cap(mLabel(months[peakI]))) + ' · todas tus tarjetas' : 'sin cuotas en los próximos 12 meses'}</small></div>
    <div class="fact"><span class="label">Quedas libre de cuotas compartidas</span><span class="big">${lastOne && lastOne.o.end ? esc(cap(mLabel(lastOne.o.end))) : '—'}</span><small>${lastOne && lastOne.o.end ? 'cuando ' + esc(lastOne.name) + ' paga su última cuota' : 'nadie te debe cuotas futuras'}</small></div>
  </section>`;

  if (!rows.length && !meVals.some(Boolean)) return facts + `<section class="empty"><h3>No hay cuotas desde ${esc(mLabel(start))}</h3><p>Todas las compras registradas terminaron antes de este mes.</p></section>`;

  const table = `<section class="proj-sec">
    <div class="sec-head"><h2>Lo que falta por pagar, mes a mes</h2><small>la línea marca la última cuota de cada uno</small></div>
    <p class="scroll-hint">Desliza la tabla para ver los 12 meses <span aria-hidden="true">→</span></p>
    <div class="tbl-wrap" tabindex="0" aria-label="Tabla de proyección, se puede desplazar hacia el lado"><table class="proj">
      <thead><tr><th scope="col">Persona</th>${months.map(k => `<th scope="col">${esc(mShort(k))}</th>`).join('')}<th scope="col">Termina</th><th scope="col">Total</th></tr></thead>
      <tbody>

function setView(v, fromHistory) {
  if (!VIEWS.includes(v)) return;
  const prev = ui.view;
  ui.view = v;
  try { localStorage.setItem(UIKEY, v); } catch (e) {}
  // Historial para el botón Atrás de Android: desde cualquier pestaña vuelve a Mes, y desde Mes sale de la app
  if (!fromHistory && v !== prev) {
    try {
      const base = location.pathname + location.search;
      if (v === 'mes') {
        if (history.state && history.state.view && history.state.view !== 'mes') history.back();
        else history.replaceState({view: 'mes', root: true}, '', base);
      } else if (prev === 'mes') history.pushState({view: v}, '', '#' + v);
      else history.replaceState({view: v}, '', '#' + v);
    } catch (e) {}
  }
  render();
  window.scrollTo({top: 0});
}

function messageFor(pid, m) {
  const name = personName(pid);
  const pm = personMonth(pid, m), ar = arrearsOf(pid, m), o = outlook(pid, m);
  const L = [`Hola ${name}! Te paso el detalle de lo que me debes de la tarjeta para ${mLabel(m)}:`, ''];
  pm.items.forEach(it => L.push(`• ${it.p.desc} (${pn(it.p) > 1 ? 'cuota ' + it.k + ' de ' + pn(it.p) : 'pago único'}): ${money(it.a)}`));
  if (pm.items.length) L.push('', `Total del mes: ${money(pm.owed)}`);
  if (pm.paid > 0) L.push(`Ya me pagaste: ${money(pm.paid)}`, `Te falta: ${money(pm.left)}`);
  if (ar.total > 0) L.push(`Además quedó pendiente ${money(ar.total)} de ${ar.months.map(x => mLabel(x.month)).join(', ')}.`);
  if (o.end && mDiff(o.end, m) > 0) L.push('', `Terminas de pagar en ${mLabel(o.end)}.`);
  else if (o.end && mDiff(o.end, m) === 0 && pm.owed > 0) L.push('', 'Con esto terminas de pagar.');
  L.push('Gracias!');
  return L.join('\n');
}
function copyMessage(pid) {

  const fallback = () => {
    openModal(`<div class="sheet-head"><h2 id="sheet-title">Mensaje para ${esc(personName(pid))}</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></div>

  };
  const copy = () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(`Mensaje para ${personName(pid)} copiado. Pégalo en WhatsApp o donde quieras.`), fallback);

function monthSelects(prefix, key) {
  const o = mParse(key); const cy = new Date().getFullYear();

  if (!years.includes(o.y)) { years.push(o.y); years.sort((a, b) => a - b); }
  return `<select id="${prefix}-m" aria-label="Mes">${MONTHS.map((n, i) => `<option value="${i + 1}" ${i + 1 === o.m ? 'selected' : ''}>${cap(n)}</option>`).join('')}</select>
    <select id="${prefix}-y" aria-label="Año">${years.map(y => `<option value="${y}" ${y === o.y ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
}
function setMonthSelects(prefix, key) {
  const o = mParse(key); const ms = $('#' + prefix + '-m'), ys = $('#' + prefix + '-y');
  if (!ms || !ys) return;
  ms.value = String(o.m);
  if (![...ys.options].some(op => op.value === String(o.y))) { const op = document.createElement('option'); op.value = op.textContent = String(o.y); ys.appendChild(op); }

}

function syncCuota(force) {

}
function updateFirstHint() {
  const el = $('#f-first-hint'); if (!el) return;
  const last = mAdd(F.first, F.n - 1);
  const c = S.cards[F.cardId];
  const bits = [];
  bits.push(F.n > 1 ? `Última cuota en ${mLabel(last)}.` : 'Pago en una sola cuota.');
  if (!F.firstTouched && c && c.cierre) bits.push(`Calculado con el cierre del día ${Math.round(num(c.cierre))} de esta tarjeta.`);

function equalize() {
  const ids = F.parts; const k = ids.length; if (!k) return;
  const base = Math.floor(F.total / k); const rem = F.total - base * k;
  F.amounts = {}; ids.forEach(id => { F.amounts[id] = base; });
  F.amounts[ids.includes(ME) ? ME : ids[0]] += rem;
}
function afterTotal() {
  if (F.parts.length === 1) F.amounts = {[F.parts[0]]: F.total};
  else if (F.mode === 'equal') equalize();
  syncAllocInputs(); updateSum();
}
function syncAllocInputs() {
  document.querySelectorAll('#f-split [data-f-amt]').forEach(inp => { if (document.activeElement !== inp) inp.value = nf.format(F.amounts[inp.dataset.fAmt] || 0); });
}
function renderSplit() {
  const box = $('#f-split'); if (!box) return;
  const all = [{id: ME, name: 'Yo'}].concat(people());
  if (F.parts.length === 1) F.amounts = {[F.parts[0]]: F.total};
  else if (F.parts.length > 1 && F.mode === 'equal') equalize();
  const multi = F.parts.length > 1;
  const locked = !multi || F.mode === 'equal';
  const chips = all.map(p => `<button type="button" class="chip" data-f-part="${esc(p.id)}" aria-pressed="${F.parts.includes(p.id)}">${dotHTML(p.id)}${esc(p.name)}</button>`).join('');
  const alloc = F.parts.map(id => `<li>
      <span class="who">${dotHTML(id)}<span class="nm">${esc(personName(id))}</span><span class="per" data-per="${esc(id)}"></span></span>
      <span class="money-in"><span>$</span><input data-f-amt="${esc(id)}" id="f-amt-${esc(id)}" inputmode="numeric" value="${nf.format(F.amounts[id] || 0)}" ${locked ? 'readonly tabindex="-1"' : ''} aria-label="Monto que paga ${esc(personName(id))}"></span>
    </li>`).join('');
  box.innerHTML = `<div class="chips">${chips}<button type="button" class="chip add" data-f-addp>+ Persona nueva</button></div>
    <div class="addp" id="f-addp" hidden><input id="f-newp" placeholder="Nombre de la persona" maxlength="40" aria-label="Nombre de la persona nueva"><button type="button" class="btn small" data-f-addp-save>Agregar</button></div>
    ${F.parts.length ? `${multi ? `<div class="seg" role="group" aria-label="Cómo dividir"><button type="button" data-f-mode="equal" aria-pressed="${F.mode === 'equal'}">Partes iguales</button><button type="button" data-f-mode="custom" aria-pressed="${F.mode === 'custom'}">Montos distintos</button></div>` : ''}
      <ul class="alloc">${alloc}</ul><p class="alloc-sum" id="f-sum"></p>`
    : '<p class="hint">Toca a quienes pagan esta compra. Si tú también pagas una parte, incluye “Yo”.</p>'}`;
  updateSum();
}
function onSplitClick(e) {
  const part = e.target.closest('[data-f-part]');
  if (part) {
    const id = part.dataset.fPart;
    if (F.parts.includes(id)) { F.parts = F.parts.filter(x => x !== id); delete F.amounts[id]; }
    else {
      F.parts.push(id);
      if (F.mode === 'custom') { const used = F.parts.reduce((s, k) => s + (k === id ? 0 : (F.amounts[k] || 0)), 0); F.amounts[id] = Math.max(0, F.total - used); }
    }
    renderSplit();
    const again = document.querySelector(`#f-split [data-f-part="${CSS.escape(id)}"]`); if (again) again.focus();
    return;
  }
  const mode = e.target.closest('[data-f-mode]');
  if (mode) {
    F.mode = mode.dataset.fMode;
    renderSplit();
    if (F.mode === 'custom') { const first = $('#f-split [data-f-amt]'); if (first) { first.focus(); first.select(); } }
    return;
  }
  if (e.target.closest('[data-f-addp]')) { const w = $('#f-addp'); w.hidden = !w.hidden; if (!w.hidden) $('#f-newp').focus(); return; }
  if (e.target.closest('[data-f-addp-save]')) addPersonFromForm();
}
function addPersonFromForm() {
  const inp = $('#f-newp'); const name = inp ? inp.value.trim() : '';
  if (!name) { if (inp) inp.focus(); return; }
  const id = newId('p');
  put('people', id, {name, color: nextColor(PCOLORS, 'people'), created: Date.now()});
  F.parts.push(id);
  if (F.mode === 'custom') { const used = F.parts.reduce((s, k) => s + (k === id ? 0 : (F.amounts[k] || 0)), 0); F.amounts[id] = Math.max(0, F.total - used); }
  renderSplit();
}
function updateSum() {
  const n = F.n || 1;
  F.parts.forEach(id => {
    const el = document.querySelector(`#f-split [data-per="${CSS.escape(id)}"]`);
    if (el) { const a = F.amounts[id] || 0; el.textContent = n > 1 ? `${money(Math.floor(a / n))} × ${n} cuotas` : 'pago único'; }
  });
  const el = $('#f-sum'); if (!el) return;
  const sum = F.parts.reduce((s, id) => s + (F.amounts[id] || 0), 0);
  const diff = F.total - sum;
  if (!F.total) { el.className = 'alloc-sum'; el.textContent = 'Escribe el monto total para repartirlo.'; return; }
  el.className = 'alloc-sum ' + (diff === 0 ? 'ok' : 'bad');
  el.textContent = diff === 0 ? `Repartido completo: ${money(sum)}` : diff > 0 ? `Faltan ${money(diff)} por asignar` : `Asignaste ${money(-diff)} de más`;
}
function savePurchase() {
  const err = m => { $('#f-err').textContent = m; return false; };
  const desc = $('#f-desc').value.trim();
  if (!desc) { $('#f-desc').focus(); return err('Escribe una descripción para la compra.'); }
  const newCardName = $('#f-newcard') ? $('#f-newcard').value.trim() : '';
  if (F.cardId === '__new' && !newCardName) { $('#f-newcard').focus(); return err('Escribe el nombre de la nueva tarjeta.'); }
  if (!(F.total > 0)) { $('#f-total').focus(); return err('Escribe el monto total de la compra.'); }
  if (!F.parts.length) return err('Elige quién paga esta compra.');
  const split = {};
  F.parts.forEach(k => { const a = Math.round(num(F.amounts[k])); if (a > 0) split[k] = a; });
  const sum = Object.values(split).reduce((a, b) => a + b, 0);
  if (sum !== F.total) return err(sum < F.total ? `Faltan ${money(F.total - sum)} por asignar entre las personas.` : `Asignaste ${money(sum - F.total)} de más. Ajusta los montos.`);
  let cardId = F.cardId;
  if (cardId === '__new') { cardId = newId('c'); put('cards', cardId, {name: newCardName, cierre: null, color: nextColor(CCOLORS, 'cards'), created: Date.now()}); }
  const prev = F.id ? S.purchases[F.id] : null;
  const id = F.id || newId('p');
  const first = F.first;
  put('purchases', id, {desc, cardId, date: F.date, total: F.total, n: F.n, first, split, mode: Object.keys(split).length > 1 ? F.mode : 'equal', example: !!(prev && prev.example), created: (prev && prev.created) || Date.now(), updated: Date.now()});
  const wasEdit = !!F.id;
  closeModal();
  toast(wasEdit ? 'Cambios guardados' : `Compra guardada · primera cuota en ${mLabel(first)}`);
}

/* ---------- payment form ---------- */
let P = null;
function openPayment(pid, month) {
  if (readOnly) { toast('Solo puedes ver esta página; no tienes permiso para editar.'); return; }
  P = {pid, month, typed: false};
  openModal(`<form id="payf" class="form" novalidate autocomplete="off">
    <div class="sheet-head" style="margin-bottom:0"><h2 id="sheet-title">Pago de ${esc(personName(pid))}</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></div>
    <div class="field"><span>Mes que está pagando</span><div class="row-inline">${monthSelects('pay', month)}</div><small id="pay-hint"></small></div>
    <div class="row2">
      <label class="field"><span>Monto pagado</span><span class="money-in"><span>$</span><input id="pay-amt" inputmode="numeric" placeholder="0"></span></label>
      <label class="field"><span>Fecha del pago</span><input type="date" id="pay-date" value="${todayISO()}"></label>
    </div>
    <label class="field"><span>Nota (opcional)</span><input id="pay-note" placeholder="Ej: transferencia, efectivo" maxlength="60"></label>
    <p class="form-err" id="pay-err" role="alert"></p>
    <div class="sheet-foot"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary">Guardar pago</button></div>
  </form>`);
  const amt = $('#pay-amt');
  const refresh = () => {
    const pm = personMonth(P.pid, P.month);
    $('#pay-hint').textContent = pm.owed ? `Debe ${money(pm.owed)} en ${mLabel(P.month)}; ya pagó ${money(pm.paid)}.` : `No tiene cuotas en ${mLabel(P.month)}.`;
    if (!P.typed) amt.value = pm.left ? nf.format(pm.left) : '';
  };
  const onM = () => { P.month = readMonthSelects('pay'); refresh(); };
  $('#pay-m').addEventListener('change', onM); $('#pay-y').addEventListener('change', onM);
  amt.addEventListener('input', () => { P.typed = true; });
  amt.addEventListener('blur', () => { const v = parseMoney(amt.value); amt.value = v ? nf.format(v) : ''; });
  $('#payf').addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseMoney(amt.value);
    if (!amount) { $('#pay-err').textContent = 'Escribe el monto que te pagó.'; amt.focus(); return; }
    const id = newId('pay');
    const who = personName(P.pid), mon = P.month;
    put('payments', id, {personId: P.pid, month: mon, amount, date: $('#pay-date').value || todayISO(), note: $('#pay-note').value.trim(), created: Date.now()});
    closeModal();
    toast(`Pago de ${who} por ${money(amount)} guardado en ${mLabel(mon)}`, {label: 'Deshacer', fn: () => remove('payments', id)});
  });
  refresh();
  setTimeout(() => { amt.focus(); amt.select(); }, 40);
}

/* ================= toast ================= */
let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="btn small" id="toast-act">${esc(action.label)}</button>` : ''}`;
  t.hidden = false;
  if (action) $('#toast-act').addEventListener('click', () => { action.fn(); t.hidden = true; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, action ? 7000 : 4000);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') { closeModal(); return; }
  const close = e.target.closest('[data-close]');
  if (close) { closeModal(); return; }
  const v = e.target.closest('[data-view]');
  if (v && !e.target.closest('#overlay')) { setView(v.dataset.view); return; }
  const t = e.target.closest('[data-act]');
  if (!t || e.target.closest('#overlay')) return;
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'new': openPurchase(); break;
    case 'edit': openPurchase(id); break;
    case 'prev': ui.month = mAdd(ui.month, -1); render(); break;
    case 'next': ui.month = mAdd(ui.month, 1); render(); break;
    case 'today': ui.month = todayKey(); render(); break;
    case 'goto-month': ui.month = t.dataset.month; setView('mes'); break;
    case 'paid-full': markPaid(id); break;
    case 'pay': openPayment(id, ui.month); break;
    case 'copy': copyMessage(id); break;
    case 'del-pay': deletePayment(id); break;
    case 'del-person': deletePerson(id); break;
    case 'del-card': deleteCard(id); break;
    case 'clear-examples': clearExamples(); break;
    case 'filter': ui.filter = t.dataset.v; render(); break;
    case 'load-examples': loadExamples(); break;
    case 'auth-google': signInGoogle(); break;
    case 'auth-toggle': { const em = $('#au-email'); if (em) authUI.email = em.value.trim(); authUI.mode = authUI.mode === 'create' ? 'login' : 'create'; render(); const f = $(authUI.email ? '#au-pass' : '#au-email'); if (f) f.focus(); break; }
    case 'auth-reset': resetPassword(); break;
    case 'sign-out': signOutNow(); break;
    case 'cloud-retry': retryCloud(); break;
    case 'migrate-yes': migrate(true); break;
    case 'migrate-no': migrate(false); break;
    case 'reload': location.reload(); break;
    case 'install': installApp(); break;
    case 'install-later': try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {} render(); break;
    case 'export': exportData(); break;
    case 'import': { const f = $('#import-file'); if (f) { f.value = ''; f.click(); } break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#overlay')) return;
  if (el.id === 'import-file') { importData(el.files && el.files[0]); return; }
  if (el.id === 'flt-card') { ui.fCard = el.value; render(); return; }
  if (el.id === 'flt-person') { ui.fPerson = el.value; render(); return; }
  if (el.dataset.rename) {
    const col = el.dataset.rename, id = el.dataset.id, cur = S[col][id];
    const name = el.value.trim();
    if (!cur) return;
    if (!name) { el.value = cur.name; return; }
    if (name !== cur.name) { put(col, id, Object.assign({}, cur, {name})); toast('Nombre actualizado'); }
    return;
  }
  if (el.dataset.cierre) {
    const id = el.dataset.id, cur = S.cards[id]; if (!cur) return;
    let v = parseInt(el.value, 10); v = v >= 1 && v <= 31 ? v : null;
    if (v !== (cur.cierre || null)) put('cards', id, Object.assign({}, cur, {cierre: v}));
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'auth-form') { e.preventDefault(); signInEmail(); return; }
  if (f.id === 'add-person') {
    e.preventDefault();
    const inp = $('#ap-name'); const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    inp.value = '';
    put('people', newId('p'), {name, color: nextColor(PCOLORS, 'people'), created: Date.now()});
    toast(`${name} agregada`);
  } else if (f.id === 'add-card') {
    e.preventDefault();
    const inp = $('#ac-name'); const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    let ci = parseInt($('#ac-cierre').value, 10); ci = ci >= 1 && ci <= 31 ? ci : null;
    inp.value = ''; $('#ac-cierre').value = '';
    put('cards', newId('c'), {name, cierre: ci, color: nextColor(CCOLORS, 'cards'), created: Date.now()});
    toast(`Tarjeta ${name} agregada`);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeModal(); });

/* ================= app instalable ================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; scheduleRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('App instalada. Ya la tienes en tu pantalla de inicio.'); scheduleRender(); });
async function installApp() {
  const ev = installEvt; if (!ev) return;
  installEvt = null;
  try { await ev.prompt(); await ev.userChoice; } catch (e) {}
  render();
}
// Atajo "Nueva compra" del ícono: ?accion=nueva
let pendingAction = null;
try {
  pendingAction = new URLSearchParams(location.search).get('accion');
  if (location.search) history.replaceState(null, '', location.pathname + location.hash);
} catch (e) {}
// Botón Atrás de Android: cierra formularios y vuelve a Mes antes de salir
try {
  history.replaceState({view: 'mes', root: true}, '', location.pathname);
  if (ui.view !== 'mes') history.pushState({view: ui.view}, '', '#' + ui.view);
} catch (e) {}
window.addEventListener('popstate', e => {
  if (!$('#overlay').hidden) { closeModal(true); return; }
  const h = (location.hash || '').slice(1);
  const v = (e.state && e.state.view) || (VIEWS.includes(h) ? h : 'mes');
  if (v !== ui.view) setView(v, true);
});
// Service worker: abrir sin internet y avisar cuando hay una versión nueva
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => toast('Hay una versión nueva de la app.', {label: 'Actualizar', fn: () => w.postMessage('skip-waiting')});
    if (reg.waiting && hadController) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

/* ================= boot ================= */
window.addEventListener('online', () => { online = true; render(); });
window.addEventListener('offline', () => { online = false; render(); });
const cfg = fbConfig();
if (cfg) {
  // Con Firebase configurado: los datos viven en la nube, en la cuenta de quien inicia sesión
  backend = 'loading';
  document.body.dataset.auth = 'loading';
  render();
  initFirebase(cfg);
} else {
  // Sin Firebase: todo se guarda en este navegador
  loadLocal();
  backend = 'local';
  document.body.dataset.auth = 'local';
  render();
  window.addEventListener('storage', e => { if (e.key === LKEY && backend === 'local') { loadLocal(); render(); } });
}
})();
</script>
